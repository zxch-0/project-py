{% extends "base.html" %}
{% block title %}Connexion · zach-runner{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">ZR</div>
    <h1 class="text-2xl font-extrabold mb-1">zach-runner</h1>
    <p class="text-sm text-slate-400 mb-6">Zone privee — saisissez votre code secret.</p>
    {% if error %}
    <div class="bg-red-500/15 border border-red-500/40 text-red-200 text-sm rounded-lg px-4 py-3 mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label class="label">Code secret</label>
        <input type="password" name="code" required autofocus autocomplete="current-password"
               class="input" placeholder="Votre code secret">
      </div>
      <button class="btn-primary w-full">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
