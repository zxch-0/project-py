{% extends "base.html" %}
{% block title %}Initialisation · zach-runner{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">ZR</div>
    <h1 class="text-2xl font-extrabold mb-1">zach-runner</h1>
    <p class="text-sm text-slate-400 mb-6">
      Premiere visite : definissez votre <strong class="text-slate-200">code secret</strong>.
      Cette page se verrouillera ensuite automatiquement — vous seul aurez acces.
    </p>
    {% if error %}
    <div class="bg-red-500/15 border border-red-500/40 text-red-200 text-sm rounded-lg px-4 py-3 mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label class="label">Code secret (min. 6 caracteres)</label>
        <input type="password" name="code" required minlength="6" autofocus autocomplete="new-password"
               class="input" placeholder="Choisissez un code long et unique">
      </div>
      <div>
        <label class="label">Confirmation</label>
        <input type="password" name="confirm" required minlength="6" autocomplete="new-password"
               class="input" placeholder="Retapez le meme code">
      </div>
      <button class="btn-primary w-full">Securiser l'acces</button>
    </form>
  </div>
</div>
{% endblock %}
