# Blueprint Render — PyRunner
# Déploiement : dashboard Render → New → Blueprint → choisir ce repo.
# Doc : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pyrunner
    runtime: python
    plan: starter          # requis pour le disque persistant + pas de mise en veille (24/7)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    disk:
      name: pyrunner-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Optionnel : force le code d'accès (sinon défini à la 1re visite du site).
      # - key: SECRET_CODE
      #   sync: false
    healthCheckPath: /api/health
